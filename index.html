<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a3fc4">
<title>甜蜜传奇 – 糖果消消乐</title>
<style>
:root{--font:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",Verdana,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#4b1d7a;font-family:var(--font);color:#fff}
button{font-family:inherit;-webkit-appearance:none;appearance:none}
#bg{position:fixed;inset:0;background:
 radial-gradient(ellipse 70% 22% at 18% 102%,#7ddb6c 0 60%,transparent 61%),
 radial-gradient(ellipse 80% 26% at 88% 106%,#5cc456 0 60%,transparent 61%),
 radial-gradient(circle at 12% 16%,rgba(255,255,255,.45) 0 2.5%,transparent 3%),
 radial-gradient(circle at 84% 10%,rgba(255,255,255,.35) 0 4%,transparent 4.5%),
 radial-gradient(circle at 70% 38%,rgba(255,255,255,.14) 0 9%,transparent 9.5%),
 radial-gradient(circle at 22% 62%,rgba(255,255,255,.12) 0 7%,transparent 7.5%),
 radial-gradient(circle at 92% 70%,rgba(255,255,255,.16) 0 5%,transparent 5.5%),
 linear-gradient(180deg,#ff8fcf 0%,#c78cff 48%,#7cc6ff 100%)}
.screen{position:fixed;inset:0;overflow:hidden}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{--sh:#1b6b17;border:0;cursor:pointer;color:#fff;font-weight:900;font-size:24px;padding:14px 40px;border-radius:999px;letter-spacing:1px;
 background:linear-gradient(180deg,#8ff06a 0%,#3cb531 55%,#2a9a22 100%);
 box-shadow:0 6px 0 var(--sh),0 10px 18px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.55);
 text-shadow:0 2px 0 rgba(0,0,0,.35);touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh),0 4px 8px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.55)}
.btn.big{font-size:34px;padding:16px 64px}
.btn.small{font-size:18px;padding:10px 22px}
.btn.orange{--sh:#a24f00;background:linear-gradient(180deg,#ffd36a,#ff9a1a 55%,#f07800)}
.btn.blue{--sh:#0f4f99;background:linear-gradient(180deg,#8fd8ff,#2e9bff 55%,#1a7ae0)}
.btn.pink{--sh:#8a1450;background:linear-gradient(180deg,#ffa8da,#ff4fa8 55%,#d62d85)}

/* ---------- title ---------- */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;touch-action:manipulation}
.logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-5deg);line-height:.95;font-weight:900;
 filter:drop-shadow(0 6px 0 #5b136b) drop-shadow(0 12px 14px rgba(0,0,0,.35));z-index:1}
.logo span{display:block;font-size:min(20vw,120px);-webkit-text-stroke:min(1vw,5px) #6d1a7e;-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;padding:0 10px}
.logo .l1{background-image:linear-gradient(180deg,#fff9b8 10%,#ffc21a 50%,#ff6a00 90%)}
.logo .l2{background-image:linear-gradient(180deg,#ffe0f4 10%,#ff5fb1 50%,#c0157a 90%)}
.tag{font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.3);z-index:1}
.foot{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:13px;opacity:.9;text-align:center;padding:0 10px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#floaters img{position:absolute;animation:float 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes float{from{transform:translateY(-14px) rotate(-14deg)}to{transform:translateY(14px) rotate(14deg)}}

/* ---------- map ---------- */
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%;max-width:560px;margin:0 auto;overflow:hidden;
 background:linear-gradient(0deg,#86e07a 0%,#4cc0a0 16%,#ff9ad0 38%,#c58cff 60%,#7cc8ff 82%,#c9ecff 100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
.mpath{position:absolute;left:0;top:0;pointer-events:none}
.deco{position:absolute;pointer-events:none;opacity:.9}
.cloud{position:absolute;pointer-events:none;background:rgba(255,255,255,.75);border-radius:999px;filter:blur(1px)}
.episode{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);background:linear-gradient(180deg,#ffe27a,#ffb020);color:#7a3a00;
 padding:6px 18px;border-radius:12px;border:3px solid #fff;font-weight:900;font-size:16px;white-space:nowrap;box-shadow:0 4px 0 #b06a00,0 6px 12px rgba(0,0,0,.25);pointer-events:none}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:4px solid #fff;
 background:radial-gradient(circle at 35% 30%,#ffc2ea,#ff4fa8 55%,#c2187a);color:#fff;font-weight:900;font-size:24px;
 box-shadow:0 5px 0 #8a1450,0 8px 14px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation;text-shadow:0 2px 0 rgba(0,0,0,.3);
 display:flex;align-items:center;justify-content:center}
.node.done{background:radial-gradient(circle at 35% 30%,#b8f5ff,#36a8ff 55%,#1764c2);box-shadow:0 5px 0 #0d3f80,0 8px 14px rgba(0,0,0,.35)}
.node.locked{background:radial-gradient(circle at 35% 30%,#f2f2f2,#a5a5b5 60%,#77778a);box-shadow:0 5px 0 #55556a,0 8px 14px rgba(0,0,0,.3);color:#f4f4f8;cursor:default;font-size:20px}
.node.cur{animation:bob .8s ease-in-out infinite alternate}
.node .ns{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:18px;white-space:nowrap;color:#ffd700;-webkit-text-stroke:1px #8a5a00;letter-spacing:-1px;text-shadow:none}
.node .ns i{color:rgba(255,255,255,.6);font-style:normal;-webkit-text-stroke:1px rgba(120,60,120,.5)}
.node .you{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:12px;background:#fff;color:#c2187a;border-radius:8px;padding:2px 6px;white-space:nowrap;text-shadow:none}
@keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.07)}}
#mapTop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:calc(8px + env(safe-area-inset-top)) 12px 18px;background:linear-gradient(180deg,rgba(90,20,120,.85),rgba(90,20,120,0));pointer-events:none}
#mapTop > *{pointer-events:auto}
.mt-title{font-size:22px;font-weight:900;text-shadow:0 2px 0 #6d1a7e}
.mt-stars{background:rgba(60,10,90,.7);border:2px solid #ffd4f2;border-radius:999px;padding:4px 12px;font-weight:900;font-size:18px}
.mt-stars span{color:#ffd700}

/* ---------- game ---------- */
#game{touch-action:none}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;align-items:stretch;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 6px 0;pointer-events:none;z-index:2}
.panel{background:linear-gradient(180deg,rgba(140,70,220,.95),rgba(80,25,150,.95));border:3px solid #ffd4f2;border-radius:16px;padding:3px 8px 5px;text-align:center;
 box-shadow:0 4px 0 rgba(60,10,100,.6),0 6px 12px rgba(0,0,0,.25)}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.92;white-space:nowrap}
#movesBox{min-width:72px}
#moves{font-size:32px;font-weight:900;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#movesBox.low #moves{color:#ffdf5c;animation:throb .6s infinite alternate}
@keyframes throb{to{transform:scale(1.12)}}
#goalBox{flex:1;max-width:250px;min-width:0}
#goalItems{display:flex;justify-content:center;align-items:center;gap:8px;min-height:38px;flex-wrap:wrap}
.gi{display:flex;align-items:center;gap:2px;font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.gi img{width:30px;height:30px}
.gi .ok{color:#8dff6b}
.gt{font-size:20px;font-weight:900}
#scoreBox{min-width:116px}
#score{font-size:22px;font-weight:900;line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.starbar{position:relative;height:10px;margin:6px 6px 4px;background:rgba(0,0,0,.4);border-radius:6px;border:1px solid rgba(255,255,255,.4)}
#starFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,#ffe066,#ff9d00);transition:width .25s}
.sbs{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:17px;font-style:normal;color:#d9c8f2;-webkit-text-stroke:1px #3a1660;transition:color .2s,transform .2s}
.sbs.on{color:#ffd700;transform:translate(-50%,-55%) scale(1.3)}
#bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 8px calc(8px + env(safe-area-inset-bottom));z-index:2;pointer-events:none}
#heroSlot{display:flex;pointer-events:none}
#heroSlot:empty{display:none}
.rb{position:relative;width:56px;height:56px;border-radius:50%;border:3px solid #fff;cursor:pointer;touch-action:manipulation;pointer-events:auto;
 background:radial-gradient(circle at 35% 30%,#ffb3e6,#e0338a 65%,#b01a6a);box-shadow:0 4px 0 #8a1450,0 6px 12px rgba(0,0,0,.3);
 display:flex;align-items:center;justify-content:center;transition:transform .08s}
.rb:active{transform:translateY(3px)}
.rb svg{width:30px;height:30px}
.rb.blue{background:radial-gradient(circle at 35% 30%,#b8f0ff,#2e9bff 65%,#1764c2);box-shadow:0 4px 0 #0d3f80,0 6px 12px rgba(0,0,0,.3)}
.rb.small{width:44px;height:44px}
.rb.small svg{width:24px;height:24px}
.rb .cnt{position:absolute;right:-6px;bottom:-6px;background:#2fa52b;border:2px solid #fff;border-radius:999px;font-size:13px;font-weight:900;min-width:24px;height:24px;line-height:20px;text-align:center;color:#fff}
.rb.active{animation:pulse .5s infinite alternate;box-shadow:0 0 0 4px #ffe066,0 4px 0 #8a1450}
.rb:disabled{filter:grayscale(1) brightness(.85);cursor:default}
@keyframes pulse{to{transform:scale(1.12)}}
#game.wide #hud{flex-direction:column;justify-content:center;right:auto;bottom:0;width:178px;padding:8px 8px 8px calc(8px + env(safe-area-inset-left))}
#game.wide #goalBox{flex:0 0 auto;max-width:none}
#game.wide #bar{flex-direction:column;justify-content:center;left:auto;top:0;width:84px;padding:8px calc(10px + env(safe-area-inset-right)) 8px 8px}
#words{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:3;overflow:hidden}
.word{position:absolute;font-size:min(15vw,78px);font-weight:900;white-space:nowrap;letter-spacing:1px;
 background:linear-gradient(180deg,#ffffff 5%,#ffe36b 45%,#ff8a00 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:min(.6vw,3px) #8b1a8f;filter:drop-shadow(0 5px 0 #5a0f63) drop-shadow(0 8px 12px rgba(0,0,0,.35));animation:wordpop 1.6s ease-out forwards}
.word.blue{background-image:linear-gradient(180deg,#fff 5%,#9be7ff 45%,#2a7fff 95%);-webkit-text-stroke-color:#123a8a}
.word.pink{background-image:linear-gradient(180deg,#fff 5%,#ffb3e0 45%,#ff2a8c 95%)}
.word.purple{background-image:linear-gradient(180deg,#fff 5%,#e5b3ff 45%,#9a2aff 95%);-webkit-text-stroke-color:#3d0a6b}
.word.orange{background-image:linear-gradient(180deg,#fff 5%,#ffd27a 45%,#ff6a00 95%)}
.word.green{background-image:linear-gradient(180deg,#fff 5%,#b8ffb0 45%,#1fae3a 95%);-webkit-text-stroke-color:#0b4019}
.word.mid{font-size:min(12vw,62px)}
.panel.bump{animation:bump .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.word.huge{font-size:min(17vw,96px);animation-duration:2.1s}
@keyframes wordpop{0%{transform:scale(.2) rotate(-10deg);opacity:0}14%{transform:scale(1.18) rotate(3deg);opacity:1}24%{transform:scale(1) rotate(0)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08) translateY(-50px)}}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:rgba(60,10,90,.9);border:2px solid #ffd4f2;padding:8px 16px;border-radius:999px;font-size:15px;z-index:4;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#game.wide #toast{bottom:16px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,0,70,.55);touch-action:manipulation}
.card{position:relative;width:100%;max-width:360px;max-height:100%;overflow:auto;background:linear-gradient(180deg,#fff6fc,#ffd6ef);border:5px solid #fff;border-radius:28px;
 box-shadow:0 0 0 5px #e04ca6,0 22px 50px rgba(0,0,0,.45);padding:0 18px 20px;text-align:center;color:#7b1a68;animation:cardIn .4s cubic-bezier(.2,1.5,.4,1)}
.card h2{margin:0 -18px 14px;padding:14px 10px;border-radius:22px 22px 0 0;background:linear-gradient(180deg,#ff8acb,#e0338a);color:#fff;font-size:30px;text-shadow:0 3px 0 #8a1450}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.card .goaltxt{font-size:19px;margin:6px 0}
.card .goalicons{display:flex;justify-content:center;gap:14px;margin:10px 0;flex-wrap:wrap}
.card .goalicons div{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:18px}
.card .goalicons img{width:46px;height:46px}
.card .els{margin:6px auto 2px;max-width:340px;text-align:left}
.card .el{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.35;margin:5px 0;background:rgba(255,255,255,.55);border-radius:12px;padding:4px 8px}
.card .el img{width:36px;height:36px;flex:0 0 auto}
.set-row{background:rgba(255,255,255,.62);border-radius:16px;padding:10px 14px 12px;margin:10px 0;text-align:left}
.set-head{display:flex;align-items:center;gap:10px;font-size:17px}
.set-head b{flex:1}
.set-ic{width:28px;height:28px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#ff4fa8;color:#fff;font-size:17px;font-weight:900}
.set-ic svg{width:18px;height:18px}
.sw{position:relative;width:58px;height:32px;border-radius:999px;border:0;padding:0;background:#cdb8da;cursor:pointer;transition:background .2s;flex:0 0 auto;touch-action:manipulation}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.28);transition:transform .2s}
.sw.on{background:linear-gradient(180deg,#86e870,#2fb34a)}
.sw.on i{transform:translateX(26px)}
.vol-line{display:flex;align-items:center;gap:10px;margin-top:10px}
.vol{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;outline:none;margin:10px 0;cursor:pointer;
 background:linear-gradient(90deg,#ff5fae var(--p,100%),#ead7f2 var(--p,100%))}
.vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #ff4fa8;box-shadow:0 2px 5px rgba(0,0,0,.28)}
.vol::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #ff4fa8;box-shadow:0 2px 5px rgba(0,0,0,.28)}
.vol:disabled{opacity:.4;cursor:default}
.vol-v{width:48px;text-align:right;font-weight:900;color:#a0306e}
.card .mv{font-size:18px;margin-top:6px}
.card .mv b{font-size:26px;color:#e0338a}
.card .targets{font-size:14px;opacity:.85;margin-top:6px}
.card .sub{font-size:24px;font-weight:900;color:#e0338a}
.card .final{font-size:20px;margin-top:6px}
.card .final b{font-size:28px;color:#e0338a}
.card .best{display:inline-block;margin-top:6px;background:#ffd400;color:#7a3a00;border-radius:999px;padding:3px 12px;font-weight:900;font-size:14px}
.card .why{font-size:17px;margin:8px 0}
.card .sad{font-size:56px;line-height:1}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:6px 0}
.stars .st{font-size:60px;line-height:1;color:#e8cde0;-webkit-text-stroke:2px #c08fb5;display:inline-block}
.stars .st:nth-child(2){font-size:76px;transform:translateY(-8px)}
.stars .st.on{color:#ffd400;-webkit-text-stroke:2px #b07800;animation:starPop .5s cubic-bezier(.2,1.8,.4,1)}
.stars .st:nth-child(2).on{animation-name:starPop2}
@keyframes starPop{from{transform:scale(2.4) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes starPop2{from{transform:translateY(-8px) scale(2.4) rotate(-40deg);opacity:0}to{transform:translateY(-8px) scale(1) rotate(0);opacity:1}}
@keyframes cardIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.help{font-size:14px;text-align:left;line-height:1.45;margin-top:4px}
.help img{width:26px;height:26px;vertical-align:middle}

/* ---------- heroes ---------- */
.candyc{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.24em;background:var(--candy-icon) center/contain no-repeat}
.mt-candy{background:rgba(60,10,90,.7);border:2px solid #ffd4f2;border-radius:999px;padding:4px 12px;font-weight:900;font-size:18px;white-space:nowrap}
@media (max-width:480px){.mt-title{display:none}}
#mapHeroes{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:8px 22px 8px 8px;font-size:22px;z-index:2}
#mapHeroes:active{transform:translateX(-50%) translateY(4px)}
#mapHeroes img{width:44px;height:44px;border-radius:50%;border:2px solid #fff}
.hero{--hs:70px;--hc:#ff4fa8;position:relative;z-index:-1;width:var(--hs);height:var(--hs);border:0;padding:0;background:none;pointer-events:auto;touch-action:manipulation;cursor:pointer;flex:0 0 auto;transition:transform .08s}
.hero:active{transform:translateY(3px)}
.hero img{position:absolute;left:9%;top:9%;width:82%;height:82%;border-radius:50%;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.hero .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.hero .ring .bgc{fill:rgba(40,0,60,.55);stroke:rgba(40,0,60,.6);stroke-width:6}
.hero .ring .fg{fill:none;stroke:var(--hc);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .35s}
.hero.ready .ring .fg{stroke:#ffe14d}
.hero.ready{animation:heroReady .55s ease-in-out infinite alternate}
.hero.ready img{box-shadow:0 0 0 3px #fff,0 0 16px 6px var(--ha,#ffe14d)}
.hero.aim{animation:pulse .45s infinite alternate}
.hero.aim img{box-shadow:0 0 0 3px #fff,0 0 18px 8px #ff4fa8}
.hero .hlv{position:absolute;left:-4px;bottom:-3px;background:var(--hc);border:2px solid #fff;border-radius:999px;font-size:11px;font-weight:900;padding:1px 5px;color:#fff;line-height:15px}
.hero .tap{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;background:#ffe14d;color:#7a3a00;border:2px solid #fff;border-radius:8px;padding:0 6px;line-height:15px;display:none;white-space:nowrap}
.hero.ready .tap{display:block}
.hero .pet{position:absolute;right:-10px;top:-6px;display:flex;align-items:center;background:#fff;border-radius:999px;padding:1px 5px 1px 1px;font-size:12px;font-weight:900;color:#c2187a;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.hero .pet img{position:static;width:20px;height:20px;box-shadow:none;border-radius:0}
@keyframes heroReady{to{transform:translateY(-5px) scale(1.06)}}
#game.wide .hero{--hs:64px}
#heroScreen{overflow:hidden}
#heroScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(66px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
#heroScroll::-webkit-scrollbar{display:none}
.hs-wrap{max-width:620px;margin:0 auto}
.hs-intro{text-align:center;font-size:15px;margin:0 0 12px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#heroGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hcard{--hc:#ff4fa8;position:relative;background:linear-gradient(180deg,#fff6fc,#ffd6ef);border:4px solid #fff;border-radius:20px;padding:12px 8px 10px;color:#7b1a68;text-align:center;

    <div><span class="candy-won"><i class="candyc"></i> ${_t('candyWon', candy)}</span></div>
    <div class="tip">${_t('tipLose')}</div>
    <div class="row"><button class="btn orange" data-a="retry">${_t('tryAgain')}</button></div>
    <div class="row"><button class="btn small pink" data-a="heroes">${_t('heroes')}</button><button class="btn small blue" data-a="map">${_t('map')}</button></div>`, {
    retry: () => startLevel(G.i),
    heroes: () => openHeroes('retry'),
    map: () => goMap(),
  }, 'sadcard');
}

/* ================= heroes screen ================= */
let heroFrom = 'map';
function canUpgrade(id, which) { const lv = heroLv(id)[which]; return lv < MAXLV && save.candy >= UPG[lv - 1]; }
function refreshCandy() { document.querySelectorAll('.candyCount').forEach(e => { e.textContent = fmt(save.candy); }); }
function openHeroes(from) {
  heroFrom = from || 'map';
  closeModal(); hideToast();
  showScreen('heroScreen'); renderHeroes();
  $('heroScroll').scrollTop = 0;
}
function closeHeroes() {
  closeModal();
  if (heroFrom === 'intro' && G && state === 'intro') {
    showScreen('game'); G.hero = makeHero(save.hero); buildHeroBtn(); layout(true); Music.play(musicForScreen()); showIntro();
  } else if (heroFrom === 'retry' && G) startLevel(G.i);
  else goMap();
}
function renderHeroes() {
  refreshCandy();
  const box = $('heroGrid');
  box.innerHTML = HERO_LIST.map(H => {
    const l = heroLv(H.id), sel = H.id === save.hero, up = canUpgrade(H.id, 'a') || canUpgrade(H.id, 'p');
    return `<button class="hcard ${sel ? 'sel' : ''}" data-h="${H.id}" style="--hc:${H.color}">
      ${sel ? `<span class="badge">${_t('selected')}</span>` : ''}${up ? `<span class="upg">${_t('upgradeBadge')}</span>` : ''}
      <img src="${heroImg(H.id)}" alt=""><div class="hn">${H.name}</div><div class="hc">${clsLabel(H)}</div>
      <div class="hl"><span>${_t('skillLv', l.a)}</span><span>${_t('passiveLv', l.p)}</span></div></button>`;
  }).join('');
  box.querySelectorAll('.hcard').forEach(b => b.addEventListener('click', () => { Snd.init(); Snd.click(); heroDetail(b.dataset.h); }));
}
function skillHTML(H, which) {
  const S = which === 'a' ? H.active : H.passive, lv = heroLv(H.id)[which], max = lv >= MAXLV, cost = max ? 0 : UPG[lv - 1];
  const pips = Array.from({ length: MAXLV }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('');
  return `<div class="skill"><div class="sk-top"><div class="sk-name">${S.name}<span class="sk-type ${which === 'p' ? 'pas' : ''}">${which === 'a' ? _t('tapSkill') : _t('alwaysOn')}</span></div><div class="pips" title="${_t('levelTitle', lv)}">${pips}</div></div>
    <div class="sk-desc">${S.desc(lv)}</div>
    ${which === 'a' ? `<div class="hd-cost">${_t('charges', costAt(H, lv))}</div>` : ''}
    ${max ? `<div class="sk-row"><span class="sk-max">${_t('maxLevel')}</span></div>`
      : `<div class="sk-next">${_t('levelN', lv + 1)}${S.desc(lv + 1)}${which === 'a' && costAt(H, lv + 1) !== costAt(H, lv) ? _t('chargeNext', costAt(H, lv + 1)) : ''}</div>
         <div class="sk-row"><span class="hd-cost">${_t('upgradeTo', lv + 1)}</span><button class="btn up" data-a="up${which}" ${save.candy < cost ? 'disabled' : ''}><i class="candyc"></i> ${fmt(cost)}</button></div>`}
  </div>`;
}
function heroDetail(id, noAnim) {
  const H = HERO[id], sel = save.hero === id;
  Music.play(id);
  modal(`<h2 style="background:linear-gradient(180deg,${H.light},${H.color});text-shadow:0 3px 0 ${H.dark}">${H.name}</h2>
    <div class="hd-head"><img src="${heroImg(id)}" alt=""><div><div class="hc">${clsLabel(H)}</div><div class="ht">${H.trait}</div><div class="hd-theme">&#9835; ${_t('theme.' + id)}</div></div></div>
    ${skillHTML(H, 'a')}${skillHTML(H, 'p')}
    <div class="row">${sel ? `<button class="btn small" disabled>${_t('selectedCheck')}</button>` : `<button class="btn small" data-a="pick">${_t('sendHero')}</button>`}<button class="btn small blue" data-a="close">${_t('close')}</button></div>
    <div class="hd-cost" style="margin-top:8px">${_t('youHave', fmt(save.candy))}</div>`, {
    upa: () => upgrade(id, 'a'), upp: () => upgrade(id, 'p'),
    pick: () => { chooseHero(id); renderHeroes(); heroDetail(id, true); },
    close: () => { closeModal(); Music.play(musicForScreen()); },
  }, 'wide');
  if (noAnim) { const card = $('modal').querySelector('.card'); if (card) card.style.animation = 'none'; }
}
function upgrade(id, which) {
  const l = heroLv(id), lv = l[which];
  if (lv >= MAXLV || save.candy < UPG[lv - 1]) { Snd.play('bad'); return; }
  save.candy -= UPG[lv - 1]; l[which] = lv + 1; persist();
  Snd.levelup();
  renderHeroes(); heroDetail(id, true);
  showToastAny(_t('toast.upgraded', HERO[id].name, which === 'a' ? HERO[id].active.name : HERO[id].passive.name, lv + 1));
}
function showToastAny(t) {
  const el = document.createElement('div');
  el.textContent = t;
  el.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(60,10,90,.92);border:2px solid #ffd4f2;color:#fff;padding:8px 16px;border-radius:999px;font-size:15px;font-weight:900;white-space:nowrap;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}
function showHeroesNews() {
  save.seenHeroes = true; persist();
  modal(`<h2>${_t('newsTitle')}</h2>
    <div class="pick">${HERO_LIST.map(H => `<button class="on" style="opacity:1;transform:none;box-shadow:0 0 0 3px ${H.color};cursor:default" tabindex="-1"><img src="${heroImg(H.id)}" alt="${H.cls}"></button>`).join('')}</div>
    <div class="help">${_t('newsBody')}</div>
    <div class="row"><button class="btn" data-a="see">${_t('meetHeroes')}</button></div>
    <div class="row"><button class="btn small blue" data-a="later">${_t('later')}</button></div>`, {
    see: () => openHeroes('map'),
    later: () => closeModal(),
  });
}
function showHelp() {
  const ic = {};
  ['h0', 'w3', 'bomb', 'jelly', 'cherry', 'frost', 'locked', 'choco', 'timer'].forEach(k => { ic[k] = `<img src="${icon(k)}" alt="">`; });
  modal(`<h2>${_t('helpTitle')}</h2><div class="help">${_t('helpBody', ic)}</div>
    <div class="row"><button class="btn" data-a="ok">${_t('gotIt')}</button></div>`, {
    ok: () => { save.seenHelp = true; save.seenHeroes = true; persist(); closeModal(); },
  });
}
function askQuit() {
  if (busy || state !== 'play') { if (state === 'over' || state === 'intro') goMap(); return; }
  modal(`<h2>${_t('leaveTitle')}</h2><div class="goaltxt">${_t('leaveText')}</div>
    <div class="row"><button class="btn small blue" data-a="map">${_t('map')}</button><button class="btn small" data-a="stay">${_t('keepPlaying')}</button></div>
    <div class="row"><button class="btn small orange" data-a="restart">${_t('restartLevel')}</button></div>`, {
    map: () => { saveRun(); goMap(); },
    stay: () => closeModal(),
    restart: () => { clearRun(); startLevel(G.i); },
  });
}
function openLevel(i) {
  if (save.run && save.run.i === i) {
    modal(`<h2>${_t('level', i + 1)}</h2><div class="goaltxt">${_t('unfinished')}</div>
      <div class="row"><button class="btn" data-a="resume">${_t('continue')}</button></div>
      <div class="row"><button class="btn small orange" data-a="restart">${_t('startOver')}</button></div>`, {
      resume: () => startLevel(i, true),
      restart: () => { clearRun(); startLevel(i); },
    });
  } else startLevel(i);
}

/* ================= screens: title & map ================= */
function musicForScreen() { return screen === 'game' && G && G.hero ? G.hero.id : 'menu'; }
function showScreen(name) {
  ['title', 'map', 'game', 'heroScreen'].forEach(s => $(s).classList.toggle('hidden', s !== name));
  if (screen !== name) { const el = $(name); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
  screen = name;
  Music.play(musicForScreen());
}
function goMap() {
  closeModal(); hideToast();
  if (screen === 'game' && state === 'play' && !busy) saveRun();
  state = 'idle'; busy = false;
  showScreen('map'); buildMap();
}
function buildMap() {
  const inner = $('mapInner'), sc = $('mapScroll');
  const N = LEVELS.length, gap = 118, top = 170, bot = 150;
  const w = Math.min(window.innerWidth, 560), h = top + bot + (N - 1) * gap, amp = Math.min(w * .28, 150);
  inner.style.height = h + 'px';
  const pts = LEVELS.map((_, i) => ({ x: Math.round(w / 2 + Math.sin(i * 1.1) * amp), y: Math.round(h - bot - i * gap) }));
  let d = `M${pts[0].x} ${pts[0].y + 80}L${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < N; i++) d += `C${pts[i - 1].x} ${pts[i - 1].y - gap * .55} ${pts[i].x} ${pts[i].y + gap * .55} ${pts[i].x} ${pts[i].y}`;
  let html = `<svg class="mpath" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${d}" fill="none" stroke="rgba(120,20,90,.3)" stroke-width="32" stroke-linecap="round" transform="translate(0,6)"/>
    <path d="${d}" fill="none" stroke="#ffe7f5" stroke-width="26" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#ff8fc8" stroke-width="5" stroke-dasharray="12 14" stroke-linecap="round"/></svg>`;
  const R = srand(4242), pathX = y => w / 2 + Math.sin((h - bot - y) / gap * 1.1) * amp;
  for (let i = 0; i < 6; i++) html += `<div class="cloud" style="left:${R() * (w - 120)}px;top:${40 + R() * (h * .35)}px;width:${80 + R() * 60}px;height:${26 + R() * 14}px"></div>`;
  for (let i = 0, placed = 0; i < 400 && placed < N * 2.4; i++) {
    const y = 60 + R() * (h - 120), x = R() * w, size = 26 + R() * 22;
    if (Math.abs(x - pathX(y)) < 62 || x < size / 2 || x > w - size / 2) continue;
    const keys = ['n0', 'n1', 'n2', 'n3', 'n4', 'n5', 'w1', 'h4', 'bomb', 'cherry'];
    html += `<img class="deco" src="${icon(keys[(R() * keys.length) | 0])}" style="left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;transform:rotate(${(R() - .5) * 60}deg)" alt="">`;
    placed++;
  }
  EPISODES.forEach((i, e) => { if (i < N) html += `<div class="episode" style="top:${pts[i].y + 52}px">${_t('ep')[e]}</div>`; });
  let total = 0;
  const curI = Math.min(save.unlocked, N) - 1;
  pts.forEach((p, i) => {
    const n = i + 1, st = save.stars[n] || 0, locked = n > save.unlocked, cur = n === save.unlocked;
    total += st;
    const cls = locked ? 'locked' : st ? 'done' : '';
    const starsHtml = st ? `<div class="ns">${'&#9733;'.repeat(st)}<i>${'&#9733;'.repeat(3 - st)}</i></div>` : '';
    const you = cur ? `<div class="you">${save.run && save.run.i === i ? _t('continue') : _t('play')}</div>` : (save.run && save.run.i === i ? `<div class="you">${_t('continue')}</div>` : '');
    const d = Math.min(700, Math.abs(i - curI) * 45);
    html += `<button class="node ${cls} ${cur ? 'cur' : ''}" data-l="${i}" style="left:${p.x}px;top:${p.y}px;animation-delay:${d}ms${cur ? `,${d + 500}ms` : ''}" aria-label="${_t('level', n)}">${locked ? '&#128274;' : n}${starsHtml}${you}</button>`;
  });
  html += `<img class="avatar" src="${heroImg(save.hero)}" alt="" style="left:${pts[curI].x - 24}px;top:${pts[curI].y - 116}px">`;
  inner.innerHTML = html;
  $('totalStars').textContent = total + ' / ' + N * 3;
  refreshCandy();
  $('mapHeroImg').src = heroImg(save.hero);
  inner.querySelectorAll('.node').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.l; Snd.init(); Snd.click();
    if (i + 1 <= save.unlocked) openLevel(i);
  }));
  const cur = pts[Math.min(save.unlocked, N) - 1];
  sc.scrollTop = Math.max(0, cur.y - sc.clientHeight * .55);
}
function buildBgFx() {
  const R = srand(2024);
  let html = '';
  for (let i = 0; i < 14; i++) {
    const size = 18 + R() * 70, dur = 16 + R() * 18;
    html += `<span class="bub" style="left:${R() * 100}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${-R() * dur}s;opacity:${.35 + R() * .45}"></span>`;
  }
  for (let i = 0; i < 9; i++) {
    const dur = 2.2 + R() * 2.8;
    html += `<span class="tw" style="left:${R() * 96}%;top:${R() * 90}%;font-size:${10 + R() * 14}px;animation-duration:${dur}s;animation-delay:${-R() * dur}s">&#10022;</span>`;
  }
  $('bgfx').innerHTML = html;
}
function buildTitle() {
  const f = $('floaters'), R = srand(99), keys = ['n0', 'n1', 'n2', 'n3', 'n4', 'n5', 'h0', 'v4', 'w3', 'bomb', 'w5', 'n1'];
  f.innerHTML = keys.map((k, i) => {
    const left = (i % 2 ? 62 + R() * 30 : 2 + R() * 26), top = 6 + (i / keys.length) * 84, size = 44 + R() * 30;
    return `<img src="${icon(k)}" alt="" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;animation-delay:${-R() * 5}s;animation-duration:${4 + R() * 3}s">`;
  }).join('');
}

/* ================= input (touch, pen & mouse via pointer events) ================= */
function cellFromEvent(e) {
  const rect = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left - BX) / T), r = Math.floor((e.clientY - rect.top - BY) / T);
  return inB(r, c) && grid[r][c] ? { r, c } : null;
}
function clearHint() { hint = null; lastAction = NOW; }
function onDown(e) {
  e.preventDefault();
  Snd.init();
  if (state !== 'play' || busy) return;
  if (drag && drag.id !== e.pointerId) return;
  const p = cellFromEvent(e);
  clearHint();
  if (!p) { selected = null; return; }
  if (heroAim) { castHero(p).catch(err => { console.error(err); busy = false; }); return; }
  if (hammerMode) { useHammer(p).catch(err => { console.error(err); busy = false; }); return; }
  if (selected && Math.abs(selected.r - p.r) + Math.abs(selected.c - p.c) === 1) {
    const s = selected; selected = null; drag = null;
    trySwap(s, p).catch(err => { console.error(err); busy = false; });
    return;
  }
  const again = selected && selected.r === p.r && selected.c === p.c;
  selected = p;
  drag = { r: p.r, c: p.c, x: e.clientX, y: e.clientY, id: e.pointerId, again };
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.id || busy) return;
  e.preventDefault();
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) < Math.max(10, T * .3)) return;
  let dr = 0, dc = 0;
  if (Math.abs(dx) > Math.abs(dy)) dc = Math.sign(dx); else dr = Math.sign(dy);
  const from = { r: drag.r, c: drag.c }, to = { r: drag.r + dr, c: drag.c + dc };
  drag = null; selected = null;
  if (inB(to.r, to.c) && grid[to.r][to.c]) trySwap(from, to).catch(err => { console.error(err); busy = false; });
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.again) selected = null;
  drag = null;
}
function checkHint() {
  if (state !== 'play' || busy || hint || hammerMode || heroAim || NOW - lastAction < 5000) return;
  const m = findMoves();
  if (m.length) { const mv = m[rnd(m.length)]; hint = [grid[mv.a.r][mv.a.c], grid[mv.b.r][mv.b.c]]; hintT = NOW; }
  else lastAction = NOW;
}

/* ================= main loop & boot ================= */
let HEADLESS = false; // automated balance runs: no drawing, virtual clock
function frame(t) {
  requestAnimationFrame(frame);
  if (HEADLESS) return; // automated balance runs drive the clock themselves via pump()
  NOW = t;
  try {
    stepTweens();
    if (screen === 'game' && G) { tickScore(); checkHint(); render(); }
    HFX.step();
    if (screen === 'game') Aura.step();
    stepConfetti(t);
  } catch (e) { console.error(e); }
}
function init() {
  document.documentElement.style.setProperty('--candy-icon', `url(${icon('w1')})`);
  cv = $('cv'); ctx = cv.getContext('2d');
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  // block page scrolling while playing, but let volume sliders be dragged
  document.addEventListener('touchmove', e => { if (screen === 'game' && !(e.target.closest && e.target.closest('.vol'))) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => Snd.init(), { passive: true }));
  $('playBtn').addEventListener('click', () => {
    Snd.init(); Snd.click(); goMap();
    if (!save.seenHelp) showHelp();
    else if (!save.seenHeroes) showHeroesNews();
    else if (save.run && LEVELS[save.run.i]) openLevel(save.run.i);
  });
  $('helpBtn').addEventListener('click', () => { Snd.init(); Snd.click(); showHelp(); });
  $('mapHome').addEventListener('click', () => { Snd.click(); showScreen('title'); });
  $('mapHeroes').addEventListener('click', () => { Snd.init(); Snd.click(); openHeroes('map'); });
  $('heroBack').addEventListener('click', () => { Snd.click(); closeHeroes(); });
  $('mapSound').addEventListener('click', openSettings);
  $('bSound').addEventListener('click', openSettings);
  $('setBtn').addEventListener('click', openSettings);
  $('bMap').addEventListener('click', () => { Snd.click(); askQuit(); });
  $('bHammer').addEventListener('click', () => {
    if (state !== 'play' || busy || G.hammer <= 0) return;
    Snd.click(); hammerMode = !hammerMode; heroAim = false; selected = null; clearHint(); updateHUD();
    if (hammerMode) showToast(_t('toast.hammer')); else hideToast();
  });
  $('bShuffle').addEventListener('click', () => { Snd.click(); useShuffle().catch(err => { console.error(err); busy = false; }); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (hammerMode || heroAim)) { hammerMode = false; heroAim = false; hideToast(); updateHUD(); } });
  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (screen === 'game') layout(); else if (screen === 'map') buildMap(); }, 80);
  });
  const persistNow = () => { if (screen === 'game') saveRun(); };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) persistNow();
    // pause all audio (music keeps no clock running) while the app is in the background
    if (Snd.ctx) { if (document.hidden) Snd.ctx.suspend().catch(() => {}); else Snd.ctx.resume().then(() => Music.resume(), () => {}); }
  });
  window.addEventListener('pagehide', persistNow);
  refreshSound(); buildTitle(); buildBgFx(); showScreen('title');
  requestAnimationFrame(frame);
}
// Small hook for automated testing / debugging from the console.
window.SweetSaga = {
  get G() { return G; }, get grid() { return grid; }, get busy() { return busy; }, get state() { return state; },
  get geo() { return { BX, BY, T }; },
  get save() { return save; }, set speed(v) { SPEED = v; }, LEVELS, HERO, findMoves, startLevel, goMap, openHeroes,
  swap: (a, b) => trySwap(a, b), dropIn: () => { closeModal(); return dropIn(); },
  chooseHero, cast: p => castHero(p), fill: () => { if (G && G.hero) { G.hero.charge = G.hero.cost; updateHUD(); } },
  findGroups, pickAreas, HP, get jelly() { return jelly; }, noHero: () => { if (G) { G.hero = null; buildHeroBtn(); } },
  audio: { get state() { return { ctx: Snd.ctx && Snd.ctx.state, track: Music.track, playing: Music.playing, want: Music.want, gain: Music.bus && +Music.bus.gain.value.toFixed(3) }; }, ctx: () => Snd.ctx, bus: () => Music.bus, play: n => Music.play(n) },
  HFX, Aura,
  // automated balance runs: skip drawing and step a virtual clock instead of waiting for real time
  pump() { NOW += 1000; stepTweens(); },
  set headless(v) { HEADLESS = !!v; },
};
init();
})();
</script>
